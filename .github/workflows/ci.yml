name: LIRA Sandbox CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Validate sandbox source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  hardened-backend:
    name: Validate hardened v2 archive against a real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Closes bank-readiness finding BR-004 ("no database integration
    # tests"): every push now actually runs the worker/reconciliation
    # resilience logic and the audit-immutability trigger against a real
    # Postgres, not just a type check.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lira
          POSTGRES_PASSWORD: lira
          POSTGRES_DB: lira_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lira:lira@localhost:5432/lira_ci
      REDIS_URL: redis://localhost:6379
      LIRA_SANDBOX_ONLY: "true"
      LIRA_REAL_MONEY_ENABLED: "false"
      JWT_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret
      SANDBOX_PROVIDER_WEBHOOK_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify hardened source archive checksum
        run: sha256sum -c lira-p2p-honduras-hardened-v2.sha256

      - name: Extract hardened source archive
        run: unzip -q lira-p2p-honduras-hardened-v2.zip -d hardened

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm via corepack
        # Deliberately not pnpm/action-setup: with two package.json files in
        # play (this repo's root, still pnpm@10.15.1, and the just-extracted
        # hardened/package.json, pnpm@10.4.1), that action either refuses to
        # run (version conflict) or ends up resolving/executing the wrong
        # one depending on caching, which is exactly what broke this job
        # twice already (see the two preceding commits). corepack, run
        # directly, is what Dockerfile.api/.worker/.reconciliation already
        # use successfully in production — same mechanism, proven to work.
        working-directory: hardened
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        working-directory: hardened
        # --ignore-workspace is required, not optional: hardened/ has no
        # pnpm-workspace.yaml of its own, and this checkout's repo root
        # (one directory up) does — pnpm walks up from cwd looking for a
        # workspace root and, finding the repo root's pnpm-workspace.yaml
        # and .git, treats THAT as the workspace root even though cwd is
        # hardened/. Without this flag pnpm installs against the outer
        # root's pnpm-lock.yaml (which has no `pg`, since the canonical
        # root tree uses mysql2, not pg) instead of hardened/'s own lockfile
        # — exactly what caused the third failure of this job (ERR_MODULE_
        # NOT_FOUND for 'pg' in scripts/migrate.mjs, despite a correct,
        # freshly-downloaded pnpm@10.4.1 install of *something*). Confirmed
        # by reproducing the exact nested-repo layout locally: without the
        # flag, `pnpm install` looked for patches/wouter@3.7.1.patch at the
        # OUTER root instead of hardened/patches/ — proving it had picked
        # up the wrong workspace root. With the flag, install, migrate, and
        # both verification scripts all pass in that same reproduction.
        run: pnpm install --no-frozen-lockfile --ignore-workspace

      - name: Apply migrations to the CI database
        working-directory: hardened
        run: node scripts/migrate.mjs

      - name: Verify audit_events immutability
        working-directory: hardened
        run: node scripts/verify-audit-immutability.mjs

      - name: Verify worker retry/dead-letter and reconciliation escalation
        working-directory: hardened
        run: pnpm exec tsx scripts/verify-worker-reconciliation.mts

      - name: Typecheck
        working-directory: hardened
        run: pnpm check

      - name: Unit tests
        working-directory: hardened
        run: pnpm test

      - name: Build all services
        working-directory: hardened
        run: pnpm build:api && pnpm build:worker && pnpm build:reconciliation && pnpm build:web
