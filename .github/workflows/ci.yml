name: LIRA Sandbox CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Validate sandbox source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate deployment boundaries
        run: node scripts/validate-deployment-contract.mjs

      - name: Inspect hardened API security contract
        run: |
          rm -rf /tmp/lira-hardened
          unzip -q lira-p2p-honduras-hardened-v2.zip -d /tmp/lira-hardened
          echo "--- hardened security router ---"
          sed -n '1,180p' /tmp/lira-hardened/server/routers.ts
          echo "--- hardened device enrollment implementation ---"
          sed -n '330,425p' /tmp/lira-hardened/server/db.ts
          echo "--- hardened payment request implementation ---"
          sed -n '910,970p' /tmp/lira-hardened/server/db.ts
          echo "--- archived client security mutations/flow ---"
          sed -n '160,280p' /tmp/lira-hardened/client/src/pages/Home.tsx
          echo "--- hardened contract matches ---"
          grep -RInE "enroll|device.*trust|trust.*device|cooling|eligibleAt|startTransferVerification|createPaymentRequest" /tmp/lira-hardened/server /tmp/lira-hardened/client 2>/dev/null | head -n 240 || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Build lira-web container
        run: docker build -f Dockerfile.web -t lira-web-ci .

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
