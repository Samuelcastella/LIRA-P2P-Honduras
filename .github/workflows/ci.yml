name: LIRA Sandbox CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Validate sandbox source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate deployment boundaries
        run: node scripts/validate-deployment-contract.mjs

      - name: Validate canonical backend reconciliation gate
        run: node scripts/validate-backend-reconciliation.mjs

      - name: Inspect hardened API security and auth contracts
        run: |
          rm -rf /tmp/lira-hardened
          unzip -q lira-p2p-honduras-hardened-v2.zip -d /tmp/lira-hardened
          echo "--- hardened security policy ---"
          sed -n '1,150p' /tmp/lira-hardened/server/security/domain.ts
          echo "--- hardened trusted device/session/otp schema ---"
          grep -n -A110 -B10 "trustedDevices\|trusted_devices" /tmp/lira-hardened/drizzle/schema.ts 2>/dev/null | head -n 180 || true
          echo "--- hardened financial domain ---"
          sed -n '1,260p' /tmp/lira-hardened/server/financial/domain.ts
          echo "--- hardened provider contract ---"
          sed -n '1,300p' /tmp/lira-hardened/server/financial/provider.ts
          echo "--- hardened transfer/outbox/reconciliation schema ---"
          sed -n '190,430p' /tmp/lira-hardened/drizzle/schema.ts
          echo "--- hardened security router ---"
          sed -n '1,180p' /tmp/lira-hardened/server/routers.ts
          echo "--- hardened device enrollment implementation ---"
          sed -n '330,425p' /tmp/lira-hardened/server/db.ts
          echo "--- hardened reconciliation and payment request implementation ---"
          sed -n '780,970p' /tmp/lira-hardened/server/db.ts
          echo "--- archived client security mutations/flow ---"
          sed -n '160,300p' /tmp/lira-hardened/client/src/pages/Home.tsx
          echo "--- hardened OAuth server contract ---"
          sed -n '1,260p' /tmp/lira-hardened/server/_core/oauth.ts 2>/dev/null || true
          echo "--- hardened OAuth client bootstrap ---"
          sed -n '1,220p' /tmp/lira-hardened/client/src/const.ts 2>/dev/null || true
          echo "--- hardened contract matches ---"
          grep -RInE "enroll|device.*trust|trust.*device|cooling|eligibleAt|startTransferVerification|createPaymentRequest|oauth|app-auth|VITE_APP_ID|VITE_OAUTH" /tmp/lira-hardened/server /tmp/lira-hardened/client 2>/dev/null | head -n 360 || true

      - name: Enforce API compatibility contract
        run: |
          grep -q 'return { request, replayed: false }' /tmp/lira-hardened/server/db.ts
          grep -q 'return { request:' server/routers.ts
          grep -q 'result.request.id' client/src/pages/Home.tsx
          if grep -q 'result.paymentRequest' client/src/pages/Home.tsx; then
            echo "Canonical client still consumes the obsolete paymentRequest response shape" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Drizzle schema and migration snapshot stay synchronized
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
        run: |
          pnpm exec drizzle-kit generate --name ci_schema_sync
          git diff --exit-code -- drizzle
          test -z "$(git status --porcelain -- drizzle)"

      - name: Check types
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Build lira-web container
        run: docker build -f Dockerfile.web -t lira-web-ci .

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
