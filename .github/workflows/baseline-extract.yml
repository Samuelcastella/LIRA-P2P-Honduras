name: Baseline extraction evidence

on:
  push:
    branches:
      - chore/postgres-canonical

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory canonical MySQL-specific persistence constructs
        shell: bash
        run: |
          set -euo pipefail
          echo '===== MYSQL-SPECIFIC TOKENS ====='
          grep -nE 'mysql2|onDuplicateKeyUpdate|affectedRows|insertId|LAST_INSERT_ID|DATE_SUB|INTERVAL [0-9]+ (MINUTE|SECOND|HOUR|DAY)' server/db.ts drizzle.config.ts package.json || true
          echo '===== CANONICAL DB EXPORTS ====='
          grep -nE '^export (async )?function|^export type' server/db.ts || true
          echo '===== BASELINE DB POSTGRES TOKENS ====='
          unzip -p lira-p2p-honduras-hardened-v2.zip server/db.ts | grep -nE 'node-postgres|Pool|onConflictDo(Update|Nothing)|returning\(|for update|interval .5 minutes.|MAX_DISPATCH_ATTEMPTS|RECONCILIATION_STALE_MS' || true
