name: PostgreSQL canonical port

on:
  push:
    branches:
      - chore/postgres-canonical

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Port hardened PostgreSQL persistence primitives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p db/migrations scripts
          unzip -p lira-p2p-honduras-hardened-v2.zip drizzle/schema.ts > drizzle/schema.ts
          unzip -p lira-p2p-honduras-hardened-v2.zip db/migrations/001_initial_postgres.sql > db/migrations/001_initial_postgres.sql
          unzip -p lira-p2p-honduras-hardened-v2.zip db/migrations/002_audit_events_immutability.sql > db/migrations/002_audit_events_immutability.sql
          unzip -p lira-p2p-honduras-hardened-v2.zip db/migrations/003_outbox_dead_letter.sql > db/migrations/003_outbox_dead_letter.sql
          unzip -p lira-p2p-honduras-hardened-v2.zip scripts/migrate.mjs > scripts/migrate.mjs
          node scripts/port-postgres.mjs
          pnpm install --lockfile-only
          rm -f scripts/port-postgres.mjs .github/workflows/postgres-port.yml .github/workflows/baseline-extract.yml
      - name: Verify mechanical port before commit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'drizzle-orm/mysql2|mysql-core|onDuplicateKeyUpdate|affectedRows|"mysql2"' server drizzle package.json drizzle.config.ts
          grep -q 'drizzle-orm/node-postgres' server/db.ts
          grep -q 'drizzle-orm/pg-core' drizzle/schema.ts
          grep -q 'dialect: "postgresql"' drizzle.config.ts
          grep -q 'dead_letter' drizzle/schema.ts
          test -f db/migrations/001_initial_postgres.sql
          test -f db/migrations/002_audit_events_immutability.sql
          test -f db/migrations/003_outbox_dead_letter.sql
          test -f scripts/migrate.mjs
      - name: Commit generated port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'chore: port canonical persistence to PostgreSQL'
          git push origin HEAD:chore/postgres-canonical
